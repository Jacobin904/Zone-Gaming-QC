<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentification - Zone Gaming QC</title>
    <link rel="icon" type="image/webp" href="https://cdn.discordapp.com/icons/1531829572453007533/c69bf91096081b8274e81a0a0eefa18e.webp?size=1024">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            color: #f5f3ed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 30px;
        }
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid #1e293b;
            border-top-color: #c9a961;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .message {
            font-size: 1.2rem;
            color: #8b8378;
            text-align: center;
        }
        .error { color: #dc2626; }
        .success { color: #059669; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <div class="message" id="message">Connexion à Discord en cours...</div>

    <script>
        // Récupérer le code d'autorisation depuis l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');

        if (error) {
            document.getElementById('message').innerHTML = '❌ Authentification annulée ou refusée.<br><a href="index.html" style="color:#c9a961">Retour</a>';
            document.getElementById('message').className = 'message error';
        } else if (code) {
            // Envoyer le code au bot pour échange
            fetch('https://zone-gaming-qc-bot.onrender.com/api/auth/discord', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Stocker les infos dans localStorage
                    localStorage.setItem('discordAuth', JSON.stringify({
                        id: data.user.id,
                        username: data.user.username,
                        discriminator: data.user.discriminator,
                        avatar: data.user.avatar,
                        authenticated: true
                    }));
                    
                    document.getElementById('message').innerHTML = '✅ Authentification réussie !<br>Redirection...';
                    document.getElementById('message').className = 'message success';
                    
                    // Rediriger vers le formulaire
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    throw new Error(data.message || 'Erreur d\'authentification');
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('message').innerHTML = '❌ Erreur: ' + err.message + '<br><a href="index.html" style="color:#c9a961">Retour</a>';
                document.getElementById('message').className = 'message error';
            });
        } else {
            document.getElementById('message').innerHTML = '❌ Code d\'autorisation manquant.<br><a href="index.html" style="color:#c9a961">Retour</a>';
            document.getElementById('message').className = 'message error';
        }
    </script>
</body>
</html>
